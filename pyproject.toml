[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etellis-u"
version = "0.1.0"
description = "Law-bearing operations with explicit theories, realizations and evidence"
requires-python = ">=3.13"
authors = [{name = "Edward Ellis"}]
license = "MIT"
dependencies = []

[project.scripts]
etellis-u = "u.cli:main"

[tool.setuptools.packages.find]
include = ["u*"]
