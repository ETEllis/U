name: U native release gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal
          build: 'true'
          test: 'false'
          lint: 'false'
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Linux platform crypto headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build U and tools from the checked C seed without Python
        run: sh bootstrap/native-build.sh
      - name: Native compiler, library, CLI, CDC and WASM verification
        run: python scripts/verify.py
      - name: Verify paper PDF and bibliography are present
        run: test -s paper/main.pdf && test -s paper/main.tex && test -s paper/main.bbl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: U-native-evidence-${{ matrix.os }}
          path: |
            artifacts/
            paper/main.pdf
